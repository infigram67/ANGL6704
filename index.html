<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngLevel — учи английский B1-B2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">📘 EngLevel</div>
  <nav class="nav" id="nav">
    <button class="nav-btn active" data-page="home">Главная</button>
    <button class="nav-btn" data-page="theory">Теория</button>
    <button class="nav-btn" data-page="dictionary">Словарь</button>
    <button class="nav-btn" data-page="practice">Практика</button>
    <button class="nav-btn" data-page="dialogues">Диалоги</button>
    <button class="nav-btn" data-page="ai">ИИ-помощник</button>
  </nav>
  <div class="level-switch">
    <label>Уровень:</label>
    <select id="levelSelect">
      <option value="all">Все</option>
      <option value="B1">B1</option>
      <option value="B2">B2</option>
    </select>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  Сделано для изучения английского · клик по слову показывает перевод
</footer>

<script src="script.js"></script>
</body>
</html>
